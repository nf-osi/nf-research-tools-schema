id: https://w3id.org/nf-research-tools/cell_line
name: nf_research_tools_cell_line
title: Cell Line
description: Cell lines used in NF research.

prefixes:
  nftools: https://w3id.org/nf-research-tools/
  linkml: https://w3id.org/linkml/

default_prefix: nftools
default_range: string

imports:
  - linkml:types
  - tool_base
  - mixins
  - donor

classes:

  CellLine:
    is_a: Tool
    annotations:
      synapse_table_id: syn26486823
    mixins:
      - HasGeneticDisorder
    slots:
      - donor
    description: >-
      A cell culture selected for uniformity from a cell population
      derived from a usually homogeneous tissue source.
    attributes:
      organ:
        description: The organ the cell line is derived from.
        range: OrganEnum
      tissue:
        description: The tissue the cell line is derived from.
        range: TissueEnum
      cellLineCategory:
        description: The category to which the cell line belongs.
        range: CellLineCategoryEnum
      originYear:
        description: The year the cell line originated.
        range: integer
      strProfile:
        description: Short tandem repeat profile information.
      populationDoublingTime:
        description: Time for cell line to double.
      resistance:
        description: List of compounds the cell line has been selected for.
        multivalued: true
      cultureMedia:
        description: >-
          The base culture medium and supplements used to maintain
          the cell line (e.g. RPMI supplemented with 10% FBS).
      organOther:
        description: Free-text specification when organ is "Other".
      mechanismOfActionValidation:
        description: >-
          Drug mechanisms of action that have been successfully tested
          in this cell line.
        range: MechanismOfActionEnum
        multivalued: true
      otherMechanismOfActionValidation:
        description: >-
          Free-text specification when mechanismOfActionValidation
          includes "Other".
      pediatricSuitability:
        description: >-
          Whether this cell line was derived from or is relevant to
          pediatric, adult, or both age groups.
        range: PediatricSuitabilityEnum
      pkpdCapabilities:
        description: >-
          Pharmacokinetic and pharmacodynamic measurements that can be
          performed using this cell line.
        range: CellLinePkpdCapabilitiesEnum
        multivalued: true
      otherPkpdCapabilities:
        description: >-
          Free-text specification when pkpdCapabilities includes "Other".
      timelineToResults:
        description: >-
          Estimated time from plating/passage to primary assay
          endpoint readout.
        range: CellLineTimelineToResultsEnum
      mtaRequired:
        description: >-
          Whether a Material Transfer Agreement is required to access
          this cell line.
        range: boolean
      ngnriRepositoryStatus:
        description: >-
          Whether this cell line is deposited in the Nick Gilbert
          Neurofibromatosis Research Institute (NGNRI) repository for
          equitable access.
        range: boolean
    slot_usage:
      resourceType:
        ifabsent: string(Cell Line)

enums:

  CellLineCategoryEnum:
    description: Categories of cell lines.
    permissible_values:
      Cancer cell line: {}
      Conditionally immortalized cell line: {}
      Embryonic stem cell: {}
      Factor-dependent cell line: {}
      Finite cell line: {}
      Hybridoma: {}
      Hybrid cell line: {}
      Induced pluripotent stem cell: {}
      Somatic stem cell: {}
      Spontaneously immortalized cell line: {}
      Stromal cell line: {}
      Telomerase immortalized cell line: {}
      Transformed cell line: {}
      Undefined cell line type: {}

  CellLinePkpdCapabilitiesEnum:
    description: >-
      Pharmacokinetic and pharmacodynamic measurements that can be
      performed using a cell line.
    permissible_values:
      Drug concentration in cell lysate/media: {}
      Target engagement measurement: {}
      Pathway modulation (e.g., pERK, pAKT): {}
      Biomarker response: {}
      Metabolite profiling: {}
      Drug-drug interaction assessment: {}
      Other: {}

  CellLineTimelineToResultsEnum:
    description: >-
      Estimated time from plating/passage to primary assay endpoint
      readout for a cell line.
    permissible_values:
      Less than 1 week: {}
      1–4 weeks: {}
      1–3 months: {}
      More than 3 months: {}
      Unknown: {}
