id: https://w3id.org/nf-research-tools/animal_model
name: nf_research_tools_animal_model
title: Animal Model
description: Animal models used in NF research.

prefixes:
  nftools: https://w3id.org/nf-research-tools/
  linkml: https://w3id.org/linkml/

default_prefix: nftools
default_range: string

imports:
  - linkml:types
  - tool_base
  - mixins
  - donor

classes:

  AnimalModel:
    is_a: Tool
    annotations:
      synapse_table_id: syn26486808
    mixins:
      - HasGeneticDisorder
    description: >-
      An animal sufficiently like humans in its anatomy, physiology,
      or response to a pathogen to be used in medical research in
      order to obtain results that can be extrapolated to human medicine.
    slots:
      - donor
      - transplantationDonor
      - transplantationType
    attributes:
      animalState:
        description: >-
          State the animal is in according to the vendor/developer
          (e.g. embryo, sperm, live).
        range: AnimalStateEnum
      backgroundStrain:
        description: >-
          The genetic background strain name. Correct strain nomenclature
          indicates what a mutant strain's background is.
      backgroundSubstrain:
        description: >-
          The substrain variety of a strain (e.g. C57BL/6J, C57BL/6Tac).
      strainNomenclature:
        description: >-
          The standard nomenclature for the strain (e.g. B6.129S2-NF1tm1Tyj/J).
          Set by the International Committee on Standardized Genetic
          Nomenclature for Mice.
      generation:
        description: The generation of the animal model (e.g. 13).
      humanizationMethod:
        description: >-
          For humanized mouse models, the method used to engraft human
          immune system components (e.g., HSC engraftment, PBMC
          transfer, BLT model).
      immuneSystemComponents:
        description: >-
          For humanized mouse models, the human immune cell populations
          engrafted.
        multivalued: true
      inducedVsDevelopmental:
        description: >-
          Whether this is an induced tumor model (tumor introduced
          experimentally) or a developmental model (tumor arises through
          genetic programming).
        range: InducedVsDevelopmentalEnum
      bbbIntegrityStatus:
        range: BbbIntegrityStatusEnum
      routeOfAdministration:
        description: >-
          Drug delivery routes that have been validated or are feasible
          in this model.
        range: RouteOfAdministrationEnum
        multivalued: true
      otherRouteOfAdministration:
        description: >-
          Free-text specification when routeOfAdministration includes "Other".
      pkpdCapabilities:
        description: >-
          Pharmacokinetic and pharmacodynamic measurements that can be
          performed in this model.
        range: PkpdCapabilitiesEnum
        multivalued: true
      mechanismOfActionValidation:
        description: >-
          Drug mechanisms of action that have been successfully tested
          in this model.
        range: MechanismOfActionEnum
        multivalued: true
      otherMechanismOfActionValidation:
        description: >-
          Free-text specification when mechanismOfActionValidation
          includes "Other".
      pediatricSuitability:
        description: >-
          Whether this model is suitable for studying pediatric, adult,
          or both age groups.
        range: PediatricSuitabilityEnum
      timelineToResults:
        description: >-
          Estimated time from experiment start to primary endpoint readout.
        range: TimelineToResultsEnum
      modelLimitations:
        description: >-
          Explicit description of what this model does NOT recapitulate
          or where it may produce false positive/negative results.
      clinicalTranslationHistory:
        description: >-
          Known instances where findings from this model did or did not
          translate to human clinical outcomes.
      regulatoryAcceptanceHistory:
        description: >-
          Known FDA/EMA precedents where data from this model type
          supported a regulatory submission or approval.
      mtaRequired:
        description: >-
          Whether a Material Transfer Agreement is required to access
          this model.
        range: boolean
      ngnriRepositoryStatus:
        description: >-
          Whether this model is deposited in the Nick Gilbert
          Neurofibromatosis Research Institute (NGNRI) repository for
          equitable access.
        range: boolean
    slot_usage:
      resourceType:
        ifabsent: string(Animal Model)
      geneticDisorder:
        required: true
      manifestation:
        required: true
        range: AnimalModelManifestationEnum

enums:

  AnimalModelManifestationEnum:
    description: >-
      Manifestations or symptoms that an animal model is used to
      model.
    permissible_values:
      No Symptoms: {}
      Acute Myeloid Leukemia: {}
      Astrocytoma: {}
      Cognition: {}
      Growth: {}
      Heart Malformation: {}
      High Grade Glioma: {}
      Low Grade Glioma: {}
      Malignant Peripheral Nerve Sheath Tumor: {}
      Metabolic Function: {}
      Neural Crest Hyperplasia: {}
      Optic Nerve Glioma: {}
      Plexiform Neurofibroma: {}
      Spinal Development: {}
      Other: {}