id: https://w3id.org/nf-research-tools/enums
name: nf_research_tools_enums
title: Shared Enumerations
description: Enumerations used across multiple modules.

prefixes:
  nftools: https://w3id.org/nf-research-tools/
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_

default_prefix: nftools
default_range: string

imports:
  - linkml:types

enums:

  ResourceTypeEnum:
    description: Type of NF research resource.
    permissible_values:
      Animal Model: {}
      Cell Line: {}
      Antibody: {}
      Genetic Reagent: {}
      Biobank: {}
      Computational Tool: {}
      Organoid Protocol: {}
      Patient-Derived Model: {}
      Clinical Assessment Tool: {}

  GeneticDisorderEnum:
    description: Genetic disorders relevant to NF research.
    permissible_values:
      Neurofibromatosis type 1:
        meaning: NCIT:C3273
      Neurofibromatosis type 2:
        meaning: NCIT:C3274
      Schwannomatosis:
        meaning: NCIT:C85188
      No known genetic disorder: {}

  TumorTypeEnum:
    description: Tumor types relevant to NF research.
    permissible_values:
      cutaneous neurofibroma: {}
      plexiform neurofibroma: {}
      atypical neurofibroma: {}
      schwannoma: {}
      meningioma: {}
      malignant peripheral nerve sheath tumor: {}
      low grade glioma: {}
      high grade glioma: {}
      pheochromocytoma: {}
      optic nerve glioma: {}
      neurofibroma NOS: {}
      diffuse infiltrating neurofibroma: {}
      brain NOS: {}
      Other: {}

  SpeciesEnum:
    description: Species of organisms.
    permissible_values:
      Homo sapiens: {}
      Mus musculus: {}
      Mus musculus (humanized): {}
      Rattus norvegicus: {}
      Drosophila melanogaster: {}
      Saccharomyces cerevisiae: {}
      Rhesus macaque: {}
      Cricetulus griseus: {}
      Xenopus laevis: {}
      Canis lupus familiaris: {}
      Pan troglodytes: {}
      Gallus gallus: {}
      Sus scrofa: {}
      Oryctolagus cuniculus: {}
      Danio rerio: {}
      Escherichia coli: {}

  SexEnum:
    description: Biological sex.
    permissible_values:
      Male:
        meaning: NCIT:C20197
      Female:
        meaning: NCIT:C16576
      Unknown: {}

  YesNoUnknownEnum:
    description: Yes, No, or Unknown.
    permissible_values:
      "Yes": {}
      "No": {}
      Unknown: {}

  UsageRequirementEnum:
    description: Known restrictions on use of the resource.
    permissible_values:
      data sharing required: {}
      non-commercial use only: {}
      re-distribution not permitted: {}
      generation of germ line transmitting chimeras not permitted: {}
      creation of functional gametes not permitted: {}
      generation of interspecies chimeras not permitted: {}
      human cloning not permitted: {}
      cannot be used for treatment purposes: {}
      IRB documentation required: {}
      special licencing restrictions (see vendor for more information): {}
      unknown: {}

  TransplantationTypeEnum:
    description: Type of transplantation.
    permissible_values:
      allograft: {}
      xenograft: {}
      autograft: {}
      isograft: {}
      syngraft: {}
      none: {}

  MechanismOfActionEnum:
    description: >-
      Drug mechanisms of action that have been validated in a
      translational model (animal model, cell line, organoid protocol,
      or patient-derived model).
    permissible_values:
      MEK inhibitors: {}
      RAS pathway (non-MEK): {}
      mTOR inhibitors: {}
      VEGF/angiogenesis: {}
      CDK inhibitors: {}
      HDAC inhibitors: {}
      Other kinase inhibitors: {}
      Immunotherapy: {}
      Chemotherapy: {}
      Other: {}

  PediatricSuitabilityEnum:
    description: >-
      Whether a translational model is suitable for studying pediatric,
      adult, or both age groups.
    permissible_values:
      Pediatric: {}
      Adult: {}
      Both: {}
      Unknown: {}

  BbbIntegrityStatusEnum:
    description: >-
      Whether the blood-brain barrier is intact, compromised, or not
      applicable in a translational model.
    permissible_values:
      Intact: {}
      Compromised: {}
      Not Applicable: {}
      Unknown: {}

  RouteOfAdministrationEnum:
    description: >-
      Drug delivery routes that have been validated or are feasible in
      an animal model or patient-derived model.
    permissible_values:
      Oral: {}
      Intravenous (IV): {}
      Intraperitoneal (IP): {}
      Intracranial: {}
      Subcutaneous: {}
      Topical: {}
      Intranasal: {}
      Other: {}

  PkpdCapabilitiesEnum:
    description: >-
      Pharmacokinetic and pharmacodynamic measurements that can be
      performed in an animal model or patient-derived model.
    permissible_values:
      Drug concentration in plasma: {}
      Drug concentration in brain/CNS tissue: {}
      Drug concentration in tumor: {}
      Drug concentration in CSF: {}
      Target engagement measurement: {}
      Pathway modulation (e.g., pERK, pAKT): {}
      Biomarker response: {}
      Metabolite profiling: {}
      Metabolic pathway flux analysis: {}
      Drug-drug interaction assessment: {}
      Other: {}

  TimelineToResultsEnum:
    description: >-
      Estimated time from experiment start to primary endpoint readout,
      for an animal model or patient-derived model.
    permissible_values:
      Less than 1 month: {}
      1–3 months: {}
      3–6 months: {}
      6–12 months: {}
      More than 12 months: {}
      Unknown: {}

  NfGeneticDisorderEnum:
    description: >-
      NF genetic disorder associated with an organoid protocol or
      patient-derived model.
    permissible_values:
      Neurofibromatosis Type 1: {}
      Neurofibromatosis Type 2: {}
      Schwannomatosis: {}
      NF1 Spontaneous Mutation: {}
      None: {}

  AnimalStateEnum:
    description: State the animal is in according to the vendor/developer.
    permissible_values:
      Alive: {}
      Deceased: {}
      Unknown: {}

  InducedVsDevelopmentalEnum:
    description: >-
      Whether an animal model is an induced tumor model (tumor
      introduced experimentally) or a developmental model (tumor
      arises through genetic programming).
    permissible_values:
      Induced Tumor Model: {}
      Developmental Model: {}
      Unknown: {}

  ObservationPhaseEnum:
    description: Life stage or phase at the time of observation.
    permissible_values:
      adolescent: {}
      adult: {}
      death phase: {}
      embryo: {}
      juvenile: {}
      larval: {}
      log phase: {}
      neonatal: {}
      postnatal: {}
      prenatal: {}
      pupal: {}
      stationary phase: {}
      weanling: {}

  TimeUnitEnum:
    description: Units of time.
    permissible_values:
      days: {}
      weeks: {}
      months: {}
      years: {}
      hours: {}
      minutes: {}
      seconds: {}
      milliseconds: {}

  RatingEnum:
    description: A 1-5 rating scale.
    permissible_values:
      "1": {}
      "2": {}
      "3": {}
      "4": {}
      "5": {}
