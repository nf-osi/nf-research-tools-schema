name: Update Observation Schema from Synapse

on:
  workflow_run:
    workflows: ["Upsert Tools to Synapse"]
    types:
      - completed
    branches:
      - main
  schedule:
    # Weekly fallback (#336): resourceName can change in Synapse without a
    # submissions/*.json push -- e.g. a rename/curation fix applied directly
    # to a live table (AnimalModelDetails, CellLineDetails, etc.) via a
    # one-time script, per scripts/README.md. Those writes never trigger
    # upsert-tools.yml, so this workflow's only other trigger (workflow_run
    # above) would never fire and the schema would silently drift -- this
    # cron catches that drift within a week regardless of what caused it.
    - cron: '0 9 * * 1'  # every Monday at 9am UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install synapseclient pandas

      - name: Run schema update script
        id: update
        env:
          # SYNAPSE_AUTH_TOKEN is optional for public tables like syn51730943
          # Only needed if the table becomes private or you hit rate limits
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
        run: |
          python scripts/update_observation_schema.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Fail loudly if the update script errored
        # continue-on-error above exists so a script failure doesn't skip the
        # "Check for changes" step below -- but a silent failure here (e.g.
        # Synapse unreachable) would otherwise be indistinguishable from a
        # real "schema is already up to date" result, since a failed run
        # writes no diff either. Surface it explicitly instead of letting
        # the workflow report success (#336).
        if: steps.update.outputs.exit_code != '0'
        run: |
          echo "::error::update_observation_schema.py exited ${{ steps.update.outputs.exit_code }} -- schema was NOT checked/updated this run, not confirmed up to date."
          exit 1

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.NF_SERVICE_GIT_TOKEN }}
          commit-message: 'chore: update observation schema from Synapse'
          title: 'Update Observation Schema from Synapse'
          assignees: BelindaBGarana
          body: |
            ## Automated Schema Update

            This PR updates `SubmitObservationSchema.json` with the latest data from Synapse materialized view `syn51730943`.

            ### Changes
            - Updated `resourceType` enum values
            - Updated `resourceName` conditional enums based on `resourceType`

            ### Data Source
            - Synapse Table: [syn51730943](https://www.synapse.org/Synapse:syn51730943/tables/)
            - Last Updated: ${{ github.event.repository.updated_at }}

            ---
            🤖 This PR was automatically generated by the [Update Observation Schema workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          branch: update-observation-schema-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            schema-update

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changes }}" = "true" ]; then
            echo "✅ Schema updated and PR created successfully"
          else
            echo "ℹ️ No changes needed - schema is up to date"
          fi
