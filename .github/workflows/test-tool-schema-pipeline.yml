name: Test Tool Schema Pipeline

# Offline PR gate for the tool-schema pipeline. No Synapse access, no secrets.
# Validates that the committed JSON Schemas will register and that Record Sets
# can be built from them, before register-tool-schemas.yml runs live on merge.
# See tests/test_tool_schema_pipeline.py for what each check catches.

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'registered-json-schemas/**'
      - 'scripts/tool_schema_config.yaml'
      - 'scripts/generate_tool_schemas.py'
      - 'scripts/register_tool_schemas.py'
      - 'scripts/create_tool_record_sets.py'
      - 'tests/**'
      - '.github/workflows/test-tool-schema-pipeline.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run pipeline tests
        run: |
          pytest tests/test_tool_schema_pipeline.py -v
