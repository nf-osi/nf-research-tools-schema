name: Test Tool Schema Pipeline

# Offline PR gate for the tool-schema and submission pipelines. No Synapse
# access, no secrets. Runs every test under tests/ -- see
# tests/test_tool_schema_pipeline.py (JSON Schema / Record Set validation,
# before register-tool-schemas.yml runs live on merge) and
# tests/test_compile_accepted_submissions.py (submission-dedup/ID-hashing
# regression tests) for what each check catches.

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'registered-json-schemas/**'
      - 'scripts/tool_schema_config.yaml'
      - 'scripts/generate_tool_schemas.py'
      - 'scripts/register_tool_schemas.py'
      - 'scripts/create_tool_record_sets.py'
      - 'tool_coverage/scripts/**'
      - 'tests/**'
      - '.github/workflows/test-tool-schema-pipeline.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run pipeline tests
        run: |
          pytest tests/ -v
